<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ilanshop3D</title>
<style>
:root{--bg:#0e0e0e;--card:#161616;--text:#f2f2f2;--muted:#8c8c8c;--accent:#f2f2f2;--border:#262626;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.4);--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.1rem}
.brand img{height:32px;border-radius:8px}
nav a{margin-left:18px;color:var(--muted);font-size:.95rem;transition:color .2s}
nav a:hover,nav a.active{color:var(--text)}
.cart-btn{position:relative;background:none;border:none;cursor:pointer;font-size:1.3rem;padding:6px;transition:transform .2s var(--ease)}
.cart-btn:hover{transform:scale(1.1)}
.badge{position:absolute;top:-4px;right:-6px;background:var(--accent);color:#fff;font-size:.7rem;border-radius:99px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease)}
.badge.bump{transform:scale(1.5)}
main{max-width:1200px;margin:auto;padding:32px 20px 80px;display:grid;grid-template-columns:1fr 240px;gap:32px}
main.wide{grid-template-columns:1fr}
.page{animation:fade .4s var(--ease);width:100%}
.narrow{max-width:560px;margin:auto}
.center{text-align:center}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:20px}
h2{font-size:1.1rem;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.lead{font-size:1.1rem;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s;animation:fade .5s var(--ease) both}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.09)}
.img{aspect-ratio:1;background:#f0f0f2;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card:hover .img img{transform:scale(1.06)}
.body{padding:16px}
.name{font-weight:600}
.price{color:var(--muted);margin:4px 0 8px}
.stock{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:10px 18px;font-size:.92rem;font-weight:500;letter-spacing:.01em;cursor:pointer;background:var(--accent);color:#fff;transition:transform .15s,opacity .2s,background .2s;font-family:inherit}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#ececf0;color:var(--text)}
.btn.danger{background:#ff3b30}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:.85rem;padding:4px}
.link.center{display:block;margin:12px auto 0}
.link.danger{color:#ff3b30}
aside.cats{position:sticky;top:90px;align-self:start}
.cats h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cats button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;border-radius:12px;cursor:pointer;font:inherit;font-size:.95rem;color:var(--text);transition:background .2s,padding .2s var(--ease)}
.cats button:hover{background:#ececf0;padding-left:16px}
.cats button.on{background:var(--text);color:#fff}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font:inherit;color:var(--text);background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
input[type=checkbox]{width:auto;display:inline-block;margin-right:6px}
.box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.summary{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.line:last-child{border-bottom:none}
.thumb{width:52px;height:52px;border-radius:12px;background:#f0f0f2;overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.li-info{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:6px}
.totals{margin-top:12px}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.ok{color:#111}
.tot.big{font-weight:700;font-size:1.15rem;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.check{width:64px;height:64px;margin:20px auto;border-radius:50%;background:#111;color:#fff;font-size:1.8rem;display:flex;align-items:center;justify-content:center;animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.add-ok{animation:pop .4s var(--ease)}
/* Tiroir panier */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,100%);background:var(--card);box-shadow:-10px 0 30px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .4s var(--ease);z-index:70;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--border);font-weight:600}
.drawer-body{padding:20px;overflow-y:auto;flex:1}
.promo-form{display:flex;gap:8px;margin:16px 0}
.promo-form input{margin:0}
.promo-tag{margin:16px 0;padding:10px 14px;background:#f0f0ee;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.promo-msg{margin:8px 0;padding:10px 14px;border-radius:8px;font-size:.9rem;animation:fade .4s var(--ease)}
.promo-msg.ok{background:#f0f0ee;color:#111;border-left:3px solid #111}
.promo-msg.ko{background:#f7f0f0;color:#8a1f1f}
/* Notification */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--text);color:#fff;padding:12px 20px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:transform .4s var(--ease);z-index:90;font-size:.95rem;max-width:90%}
.toast.show{transform:translate(-50%,0)}
/* Skeleton */
.sk{background:linear-gradient(90deg,#eee,#f7f7f7,#eee);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--radius);aspect-ratio:1}
@keyframes sh{to{background-position:-200% 0}}
/* Admin */
.admin-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tabs button{border:none;background:#ececf0;padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:.9rem;transition:background .2s,transform .15s}
.tabs button:hover{transform:translateY(-1px)}
.tabs button.on{background:var(--text);color:#fff}
.two{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:28px}
.stat{padding:20px}
.stat .big{font-size:1.6rem;font-weight:700;margin-top:4px}
.table-wrap{overflow-x:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;font-size:.9rem;vertical-align:top}
th{color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
select.status{width:auto;margin:0;padding:6px 10px;border-radius:99px;font-size:.85rem}
.thumb-sm{width:40px;height:40px;border-radius:10px;background:#f0f0f2;overflow:hidden}
.thumb-sm img{width:100%;height:100%;object-fit:cover}
@media (max-width:800px){
  main{grid-template-columns:1fr}
  aside.cats{position:static;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .cats h2{width:100%}
  .cats button{display:inline-block;width:auto}
  .cats button:hover{padding-left:12px}
  .two{grid-template-columns:1fr}
  nav a{margin-left:12px}
  h1{font-size:1.6rem}
}
header{background:rgba(14,14,14,.85)}
.img,.thumb,.thumb-sm{background:#1f1f1f}
input,select,textarea{background:#101010;color:var(--text)}
.btn{color:#111}
.btn.ghost{background:#222;color:var(--text)}
.btn.ghost:hover{background:#2a2a2a}
.tabs button{background:#1f1f1f;color:var(--text)}
.tabs button.on{background:var(--accent);color:#111}
.cats button{color:var(--text)}
.cats button:hover{background:#1f1f1f}
.cats button.on{background:var(--accent);color:#111}
.toast{background:var(--accent);color:#111}
.check{background:var(--accent);color:#111}
.promo-tag,.promo-msg.ok{background:#1f1f1f;color:var(--text)}
.promo-msg.ok{border-left-color:var(--accent)}
.promo-msg.ko{background:#2a1515;color:#f0a0a0}
.tot.ok{color:var(--text)}
.sk{background:linear-gradient(90deg,#1a1a1a,#262626,#1a1a1a);background-size:200% 100%}
.badge{background:var(--accent);color:#111}
/* ===== Épuration ===== */
.card{box-shadow:none;border:1px solid var(--border)}
.card:hover{box-shadow:0 18px 40px rgba(0,0,0,.45);border-color:#333}
.body{padding:18px 18px 20px}
.name{letter-spacing:-.01em;font-size:1rem}
.price{font-variant-numeric:tabular-nums;color:var(--text);opacity:.75}
h1{font-weight:600;letter-spacing:-.03em}
main{padding-top:48px}
.grid{gap:28px}
.img{border-radius:0}
.img img{transition:transform .8s var(--ease),filter .6s}
.card:hover .img img{transform:scale(1.08);filter:brightness(1.05)}

/* ===== Animations d'apparition en cascade ===== */
.grid .card{animation:rise .7s var(--ease) both}
.grid .card:nth-child(1){animation-delay:.04s}
.grid .card:nth-child(2){animation-delay:.1s}
.grid .card:nth-child(3){animation-delay:.16s}
.grid .card:nth-child(4){animation-delay:.22s}
.grid .card:nth-child(5){animation-delay:.28s}
.grid .card:nth-child(6){animation-delay:.34s}
.grid .card:nth-child(n+7){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.page{animation:rise .6s var(--ease) both}
.line{animation:fade .5s var(--ease) both}
.cats button{transition:background .3s,color .3s,transform .3s var(--ease),padding .3s var(--ease)}
.cats button.on{transform:translateX(4px)}

/* ===== Boutons ===== */
.btn{position:relative;overflow:hidden;transition:transform .25s var(--ease),opacity .25s,background .3s,box-shadow .3s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease);pointer-events:none}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,255,255,.08)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:disabled:hover{transform:none;box-shadow:none}
.btn:disabled::after{display:none}
.link{transition:opacity .2s,transform .2s}
.link:hover{opacity:.6;transform:translateX(2px)}

/* ===== Navigation ===== */
nav a{position:relative;transition:color .3s}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--text);transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
nav a:hover::after,nav a.active::after{transform:scaleX(1);transform-origin:left}
.brand{transition:opacity .3s}
.brand:hover{opacity:.7}
.cart-btn{letter-spacing:.02em;font-size:.95rem;font-weight:500;color:var(--text);transition:transform .3s var(--ease)}
.badge{transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .3s}

/* ===== Tiroir panier ===== */
.drawer{box-shadow:none;border-left:1px solid var(--border);transition:transform .55s var(--ease)}
.overlay{backdrop-filter:blur(3px)}
.drawer-body .line{transition:background .3s}
.drawer-body .line:hover{background:rgba(255,255,255,.02)}
.promo-form input{transition:border-color .3s,box-shadow .3s}
.promo-form input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.08)}

/* ===== Champs et formulaires ===== */
label{transition:color .2s}
label:focus-within{color:var(--text)}
input,select,textarea{transition:border-color .3s,box-shadow .3s,background .3s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.box{box-shadow:none;border:1px solid var(--border)}
.summary{box-shadow:none;border:1px solid var(--border)}

/* ===== Toast ===== */
.toast{font-size:.88rem;letter-spacing:.01em;box-shadow:0 12px 32px rgba(0,0,0,.5)}

/* ===== Confirmation ===== */
.check{animation:pop .8s cubic-bezier(.34,1.56,.64,1)}

/* ===== Admin ===== */
.stat{transition:transform .4s var(--ease),border-color .3s}
.stat:hover{transform:translateY(-3px);border-color:#333}
.table-wrap{box-shadow:none;border:1px solid var(--border)}
.table-wrap tr{transition:background .25s}
.table-wrap tr:hover td{background:rgba(255,255,255,.02)}
.tabs button{transition:background .3s,color .3s,transform .25s var(--ease)}
.tabs button:active{transform:scale(.95)}

/* ===== Cadre sur le fond du site ===== */
body{background:radial-gradient(ellipse at top,#1a1a1a 0%,#0e0e0e 55%) fixed,#0e0e0e;min-height:100vh}
body::before{content:"";position:fixed;inset:12px;border:1px solid rgba(255,255,255,.08);border-radius:24px;pointer-events:none;z-index:40}
body::after{content:"";position:fixed;inset:20px;border:1px solid rgba(255,255,255,.035);border-radius:18px;pointer-events:none;z-index:40}
@media (max-width:800px){body::before{inset:6px;border-radius:16px}body::after{inset:11px;border-radius:12px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" id="brand" href="#/"></a>
    <div style="display:flex;align-items:center">
      <nav>
        <a href="#/" data-nav="/">Boutique</a>
        <a href="#/apropos" data-nav="/apropos">À propos</a>
        <a href="#/contact" data-nav="/contact">Contact</a>
      </nav>
      <button class="cart-btn" data-cart-open aria-label="Ouvrir le panier">Panier<span class="badge" id="badge">0</span></button>
    </div>
  </div>
</header>

<main id="main" class="layout"></main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Panier">
  <div class="drawer-head"><span>Mon panier</span><button class="link" data-cart-close>Fermer ✕</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ===== Données (stockées dans le navigateur) ===== */
const KEY = 'boutique_entre_potes_v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = c => (c / 100).toLocaleString('fr-FR', {style:'currency', currency:'EUR'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const defaults = {
  shopName: 'ilanshop3D', logo: '', products: [], categories: [], promos: [], orders: [],
  adminHash: null, about: '', contact: {email: '', phone: ''}
};
const STATUS = {pending:'En attente', appointment:'Rendez-vous fixé', paid:'Payé', done:'Terminé', cancelled:'Annulé'};

let db = load();
let cart = JSON.parse(localStorage.getItem(KEY + '_cart') || '[]');
let promo = JSON.parse(localStorage.getItem(KEY + '_promo') || 'null');
let promoMsg = null;
let currentCat = 'all';
let session = false;
let adminTab = 'dash';
let editing = {};
let pendingImg = null;
let lastOrder = null;

function load() {
  try { return {...defaults, ...JSON.parse(localStorage.getItem(KEY) || '{}')}; }
  catch { return {...defaults}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { toast('Enregistrement impossible : stockage plein, utilise des images plus petites'); }
}
function saveCart() { localStorage.setItem(KEY + '_cart', JSON.stringify(cart)); }
function persist(msg) { save(); render(); if (msg) toast(msg); }

async function sha(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function resizeImage(file, max = 900) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = img.width * k; c.height = img.height * k;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .85));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ===== Notifications ===== */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ===== Panier ===== */
function totals() {
  const lines = cart.map(l => {
    const p = db.products.find(x => x.id === l.id);
    return p ? {...l, p, sub: p.priceCents * l.qty} : null;
  }).filter(Boolean);
  const subtotal = lines.reduce((s, l) => s + l.sub, 0);
  const live = promo && db.promos.find(p => p.active && p.code === promo.code);
  const pct = live ? live.percent : 0;
  const discount = Math.round(subtotal * pct / 100);
  return {lines, subtotal, pct, discount, total: subtotal - discount, promoCode: live ? live.code : null};
}
function addToCart(id) {
  const p = db.products.find(x => x.id === id);
  if (!p) return;
  const line = cart.find(l => l.id === id);
  const have = line ? line.qty : 0;
  if (p.stock != null && have >= p.stock) return toast('Stock maximum atteint');
  if (line) line.qty++; else cart.push({id, qty: 1});
  saveCart();
  const b = $('#badge');
  b.classList.add('bump');
  setTimeout(() => b.classList.remove('bump'), 300);
  updateBadge();
  renderDrawer();
  toast(`${p.name} ajouté au panier`);
}
function changeQty(id, delta) {
  const line = cart.find(l => l.id === id);
  const p = db.products.find(x => x.id === id);
  if (!line) return;
  if (delta > 0 && p && p.stock != null && line.qty >= p.stock) return toast('Stock maximum atteint');
  line.qty += delta;
  if (line.qty < 1) cart = cart.filter(l => l.id !== id);
  saveCart(); updateBadge(); renderDrawer();
}
function removeLine(id) { cart = cart.filter(l => l.id !== id); saveCart(); updateBadge(); renderDrawer(); }
function clearCart() { cart = []; saveCart(); updateBadge(); renderDrawer(); }
function updateBadge() { $('#badge').textContent = cart.reduce((s, l) => s + l.qty, 0); }
function toggleCart(open) {
  $('#drawer').classList.toggle('open', open);
  $('#overlay').classList.toggle('show', open);
}
function applyPromo(f) {
  const code = f.code.value.trim().toUpperCase();
  const found = db.promos.find(p => p.active && p.code.toUpperCase() === code);
  if (!found) {
    promoMsg = {ok: false, text: 'Ce code n’est pas valide.'};
  } else {
    promo = {code: found.code, percent: found.percent};
    localStorage.setItem(KEY + '_promo', JSON.stringify(promo));
    promoMsg = {ok: true, text: `Code appliqué : réduction de ${found.percent} %`};
  }
  renderDrawer();
}
function removePromo() {
  promo = null; promoMsg = null;
  localStorage.removeItem(KEY + '_promo');
  renderDrawer();
}
function cartLines(t, editable) {
  return t.lines.map(l => `
    <div class="line">
      <div class="thumb">${l.p.image ? `<img src="${l.p.image}" alt="">` : ''}</div>
      <div class="li-info"><div>${esc(l.p.name)}</div><div class="muted small">${eur(l.p.priceCents)} · ${eur(l.sub)}</div></div>
      ${editable ? `<div class="qty">

function totalsHtml(t) {

function renderDrawer() {
  const body = $('#drawer-body');
  const t = totals();
  if (!t.lines.length) {
    body.innerHTML = '<p class="muted">Ton panier est vide.</p>';
    updateBadge();
    return;
  }
  body.innerHTML = `
    ${cartLines(t, true)}
    ${promo && t.pct
      ? `<div class="promo-tag"><span>Code <b>${esc(promo.code)}</b> : −${t.pct} %</span><button class="link" data-remove-promo>Retirer</button></div>`
      : `<form id="f-cart-promo" class="promo-form"><input name="code" placeholder="Code promo" autocomplete="off"><button class="btn ghost small">Appliquer</button></form>`}
    ${promoMsg ? `<p class="promo-msg ${promoMsg.ok ? 'ok' : 'ko'}">${promoMsg.text}</p>` : ''}
    <div class="totals">${totalsHtml(t)}</div>
    <a class="btn full" style="margin-top:16px" href="#/commande" data-close-cart>Commander</a>
    <button class="link center" data-clear>Vider le panier</button>`;

function placeOrder(f) {
  const nameField = f.elements.namedItem('name');
  const name = nameField.value.trim();
  if (!name) { toast('Indique ton nom pour commander'); nameField.focus(); return; }
  const t = totals();
  if (!t.lines.length) return;
  for (const l of t.lines) {
    if (l.p.stock != null && l.p.stock < l.qty) return toast(`Stock insuffisant : ${l.p.name}`);
  }
  t.lines.forEach(l => { if (l.p.stock != null) l.p.stock -= l.qty; });
  lastOrder = {
    id: uid(), customer: name, message: f.message.value.trim(),
    items: t.lines.map(l => ({name: l.p.name, unitCents: l.p.priceCents, qty: l.qty})),
    subtotal: t.subtotal, promoCode: t.promoCode, discountPercent: t.pct,
    total: t.total, status: 'pending', date: new Date().toISOString()
  };
  db.orders.unshift(lastOrder);
  save();
  cart = []; saveCart();
  promo = null; promoMsg = null; localStorage.removeItem(KEY + '_promo');
  location.hash = '#/confirmation';
  toast('Nouvelle commande reçue');
}

/* ===== Actions admin ===== */
async function adminAuth(f) {
  const pwd = f.password.value;
  if (!db.adminHash) {
    if (pwd.length < 8) return toast('8 caractères minimum');
    db.adminHash = await sha(pwd);
    save();
    session = true;
    toast('Mot de passe créé');
  } else {
    if (await sha(pwd) !== db.adminHash) { toast('Mot de passe incorrect'); f.password.value = ''; return; }
    session = true;
  }
  render();
}
function saveProduct(f) {
  const data = {
    name: f.elements.namedItem('name').value.trim(),
    priceCents: Math.round(parseFloat(f.price.value) * 100),
    categoryId: f.categoryId.value || null,
    stock: f.stock.value === '' ? null : parseInt(f.stock.value, 10),
    description: f.description.value.trim()
  };
  if (!data.name || isNaN(data.priceCents)) return toast('Nom et prix obligatoires');
  const id = f.elements.namedItem('id').value;
  if (id) {
    const p = db.products.find(x => x.id === id);
    Object.assign(p, data, {image: pendingImg || p.image || ''});
  } else {
    db.products.push({id: uid(), ...data, image: pendingImg || ''});
  }
  pendingImg = null; editing = {};
  persist('Produit enregistré');
}
function saveCategory(f) {
  const name = f.elements.namedItem('name').value.trim();
  if (!name) return;
  const id = f.elements.namedItem('id').value;
  if (id) {
    const c = db.categories.find(x => x.id === id);
    c.name = name;
    if (pendingImg) c.image = pendingImg;
  } else {
    db.categories.push({id: uid(), name, image: pendingImg || ''});
  }
  pendingImg = null; editing = {};
  persist('Catégorie enregistrée');
}
function savePromo(f) {
  const code = f.code.value.trim().toUpperCase();
  const percent = parseInt(f.percent.value, 10);
  const active = f.active.checked;
  if (!code || !(percent >= 1 && percent <= 100)) return toast('Code et pourcentage valides requis');
  const id = f.elements.namedItem('id').value;
  if (id) Object.assign(db.promos.find(p => p.id === id), {code, percent, active});
  else db.promos.push({id: uid(), code, percent, active});
  editing = {};
  persist('Code promo enregistré');
}
function saveSettings(f) {
  db.shopName = f.shopName.value.trim() || db.shopName;
  db.about = f.about.value.trim();
  db.contact = {email: f.email.value.trim(), phone: f.phone.value.trim()};
  if (pendingImg) db.logo = pendingImg;
  pendingImg = null;
  persist('Réglages enregistrés');
}
async function changePassword(f) {
  const pwd = f.password.value;
  if (pwd.length < 8) return toast('8 caractères minimum');
  db.adminHash = await sha(pwd);
  f.reset();
  persist('Mot de passe modifié');
}
function deleteItem(kind, id) {
  if (!confirm('Confirmer la suppression ?')) return;
  if (kind === 'product') db.products = db.products.filter(p => p.id !== id);
  if (kind === 'category') {
    db.categories = db.categories.filter(c => c.id !== id);
    db.products.forEach(p => { if (p.categoryId === id) p.categoryId = null; });
    if (currentCat === id) currentCat = 'all';
  }
  if (kind === 'promo') db.promos = db.promos.filter(p => p.id !== id);
  if (kind === 'order') db.orders = db.orders.filter(o => o.id !== id);
  editing = {};
  persist('Supprimé');
}
function updateStatus(id, status) {
  const o = db.orders.find(x => x.id === id);
  if (!o) return;
  o.status = status;
  save();
  toast(`Statut : ${STATUS[status]}`);
}

/* ===== Routage et rendu ===== */
function render() {
  const path = location.hash.replace(/^#/, '') || '/';
  const main = $('#main');
  main.className = path === '/' ? 'layout' : 'wide';
  document.title = db.shopName;
  $('#brand').innerHTML = (db.logo ? `<img src="${db.logo}" alt="">` : '') + `<span>${esc(db.shopName)}</span>`;
  const views = {
    '/': viewShop, '/apropos': () => viewStatic('À propos', db.about), '/contact': viewContact,
    '/commande': viewCheckout, '/confirmation': viewConfirm, '/admin': viewAdmin
  };
  main.innerHTML = (views[path] || viewShop)();
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === path));
  updateBadge();
  renderDrawer();
}

/* ===== Événements ===== */
document.addEventListener('click', e => {
  if (e.target.id === 'overlay') return toggleCart(false);
  const el = e.target.closest('button,a');
  if (!el) return;
  if (el.type === 'submit' && el.form) {
    e.preventDefault();
    return handleForm(el.form);
  }
  const d = el.dataset;
  if (d.cartOpen !== undefined) return toggleCart(true);
  if (d.cartClose !== undefined || d.closeCart !== undefined) return toggleCart(false);
  if (d.add) return addToCart(d.add);
  if (d.cat !== undefined) { currentCat = d.cat; return render(); }
  if (d.qty) return changeQty(d.qty, +d.delta);
  if (d.remove) return removeLine(d.remove);
  if (d.clear !== undefined) return clearCart();
  if (d.removePromo !== undefined) return removePromo();
  if (d.tab) { adminTab = d.tab; editing = {}; return render(); }
  if (d.cancel !== undefined) { editing = {}; return render(); }
  if (d.logout !== undefined) { session = false; return render(); }
  if (d.act === 'edit') { editing = {kind: d.kind, id: d.id}; return render(); }
  if (d.act === 'del') return deleteItem(d.kind, d.id);
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.status) return updateStatus(t.dataset.status, t.value);
  if (t.dataset.img) {
    resizeImage(t.files[0]).then(data => { pendingImg = data; toast('Image chargée'); })
      .catch(() => toast('Image illisible'));
  }
  if (t.name === 'active' && t.form && t.form.id === 'f-promo') { /* géré à l’envoi */ }
});

function handleForm(f) {
  toast('Enregistrement…');
  switch (f.id) {
    case 'f-checkout': return placeOrder(f);
    case 'f-setup': case 'f-login': return adminAuth(f);
    case 'f-product': return saveProduct(f);
    case 'f-category': return saveCategory(f);
    case 'f-promo': return savePromo(f);
    case 'f-settings': return saveSettings(f);
    case 'f-cart-promo': return applyPromo(f);
    case 'f-password': return changePassword(f);
  }
}
document.addEventListener('submit', e => {
  e.preventDefault();
  handleForm(e.target);
});

window.addEventListener('hashchange', render);
window.addEventListener('error', e => toast('Erreur : ' + e.message));
window.addEventListener('unhandledrejection', e => toast('Erreur : ' + (e.reason?.message || e.reason)));
